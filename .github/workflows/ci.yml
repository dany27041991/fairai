name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install (CPU torch)
        run: |
          python -m pip install --upgrade pip
          pip install --index-url https://download.pytorch.org/whl/cpu "torch>=2.2"
          pip install -e ".[dev]"
          pip install "transformers>=4.40"

      - name: Lint
        run: ruff check src tests

      - name: Unit tests + file budget
        run: fairai smoke --skip-forward --device cpu

      - name: Docker smoke image
        run: |
          docker compose build smoke
          docker compose --profile ci run --rm smoke fairai smoke --skip-forward --device cpu
