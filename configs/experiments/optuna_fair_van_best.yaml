name: optuna_fair_van_best
backbone: sentence-transformers/all-MiniLM-L6-v2
num_labels: 3
max_len: 512
architecture:
  gen_num_layers: 3
  gen_hidden_size: 512
  gen_dropout: 0.3528853888341291
  gen_dropout_reg: 0.09162071194590601
  multihead_num_heads: 8
  att_dropout: 0.2076945886371951
  bias_dim: 512
  bias_num_layers: 1
  bias_dropout: 0.04986540521746553
  bias_lambda: 0.6036837940390388
  use_bias_projection: true
loss:
  alpha: 1.7313970887972134
  gamma: 1.7557007304209609
