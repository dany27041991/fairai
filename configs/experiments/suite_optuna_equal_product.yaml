# Scientifically symmetric compare:
# ALL neural families = equal-budget Optuna finals (opta-*), 3 seeds
# Eval plane = leak-free F1 + StereoSet subset=test iCAT (same metrics as Table A)
# Frozen LR = no Optuna (one-shot)
name: suite_optuna_equal_product
device: cuda
aggregate: true
experiments:
  - config: experiments/optuna_fair_van_best.yaml
    run_id: opta-van-s42
    run_dir: artifacts/models/runs/opta-van-s42
  - config: experiments/optuna_fair_van_best.yaml
    run_id: opta-van-s123
    run_dir: artifacts/models/runs/opta-van-s123
  - config: experiments/optuna_fair_van_best.yaml
    run_id: opta-van-s7
    run_dir: artifacts/models/runs/opta-van-s7
  - config: experiments/optuna_fair_ce_best.yaml
    run_id: opta-ce-s42
    run_dir: artifacts/models/runs/opta-ce-s42
  - config: experiments/optuna_fair_ce_best.yaml
    run_id: opta-ce-s123
    run_dir: artifacts/models/runs/opta-ce-s123
  - config: experiments/optuna_fair_ce_best.yaml
    run_id: opta-ce-s7
    run_dir: artifacts/models/runs/opta-ce-s7
  - config: experiments/optuna_fair_no_bpl_best.yaml
    run_id: opta-no_bpl-s42
    run_dir: artifacts/models/runs/opta-no_bpl-s42
  - config: experiments/optuna_fair_no_bpl_best.yaml
    run_id: opta-no_bpl-s123
    run_dir: artifacts/models/runs/opta-no_bpl-s123
  - config: experiments/optuna_fair_no_bpl_best.yaml
    run_id: opta-no_bpl-s7
    run_dir: artifacts/models/runs/opta-no_bpl-s7
  - config: experiments/rigorous_baseline_frozen_lr.yaml
    run_id: rigc-baseline_frozen_lr-s42
    run_dir: artifacts/models/runs/rigc-baseline_frozen_lr-s42
eval:
  dataset: processed/stereoset/f1_test_leakfree.jsonl
  batch_size: 64
  subset: test
  stereoset_splits: splits/stereoset
  eval_out_dir: results/metrics/eval_reports_opta_equal_product
out: results/metrics/optuna_equal_product_compare.json
