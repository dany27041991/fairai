[project]
name = "fairai"
version = "0.1.0"
description = "FAIRAI / VAN — stereotype detection corpus, dual-axis eval, and Optuna-tuned classifier (University of Salento)"
readme = "README.md"
license = { text = "Proprietary — Copyright (c) Danilo Giovannico, University of Salento. All rights reserved." }
requires-python = ">=3.11"
authors = [
  { name = "Danilo Giovannico", email = "danilo.giovannico@studenti.unisalento.it" },
]
dependencies = [
  "numpy>=1.26",
  "pyyaml>=6.0",
  "tqdm>=4.66",
  "typer>=0.12",
  "scikit-learn>=1.4",
  "optuna>=3.6",
]

[project.optional-dependencies]
torch = [
  "torch>=2.2",
  "transformers>=4.40",
]
viz = [
  "matplotlib>=3.8",
  "seaborn>=0.13",
  "scipy>=1.11",
  "pandas>=2.1",
]
nlp = [
  "nltk>=3.8",
  "sentence-transformers>=2.7",
]
dev = [
  "pytest>=8.0",
  "ruff>=0.4",
  "mypy>=1.10",
  "types-PyYAML>=6.0",
]
llm = [
  "gymnasium>=0.29",
]
all = ["fairai[torch,dev,llm,viz,nlp]"]

[project.scripts]
fairai = "fairai.cli.main:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/fairai"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["B008"]  # Typer Option() defaults are intentional

[tool.mypy]
python_version = "3.11"
mypy_path = "src"
packages = ["fairai"]
ignore_missing_imports = true
warn_unused_ignores = true
check_untyped_defs = true
exclude = ["tests/", "scripts/"]

[[tool.mypy.overrides]]
module = [
  "fairai.infrastructure.torch_van.*",
  "fairai.application.evaluate_classification",
  "fairai.application.evaluate_icat",
  "fairai.application.infer_texts",
]
disable_error_code = ["operator", "arg-type", "misc", "import-untyped"]
