name: optuna_fair_van_best
backbone: sentence-transformers/all-MiniLM-L6-v2
num_labels: 3
max_len: 512
architecture:
  gen_num_layers: 8
  gen_hidden_size: 512
  gen_dropout: 0.08526206184364576
